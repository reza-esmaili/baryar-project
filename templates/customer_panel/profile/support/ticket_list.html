{% extends 'customer_panel/profile/profile_base.html' %}
{% load static %}

{% block profile_content %}
  <link rel="stylesheet" href="{% static 'support/css/ticket_list_modern.css' %}" />

  <div class="support-wrapper">
    <!-- هدر اصلاح شده برای تراز دقیق -->
    <!-- هدر اصلاح شده -->
    <div class="support-header">
      <!-- سمت راست: عنوان -->
      <div>
        <h4 class="fw-bold m-0">مدیریت و پیگیری تیکت‌های شما</h4>
      </div>

      <!-- سمت چپ: دکمه -->
      <a href="{% url 'customer_support:ticket_create' %}" class="btn btn-primary px-4 py-2">ثبت تیکت جدید</a>
    </div>

    <!-- فیلترها -->
    <div class="modern-card">
      <div class="filter-row">
        <div class="filter-group">
          <select id="departmentFilter">
            <option value="">همه واحدها</option>
            {% for d in departments %}
              <option value="{{ d.id }}">{{ d.name }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="filter-group">
          <input type="date" id="dateFrom" placeholder="از تاریخ" />
        </div>
        <div class="filter-group">
          <input type="date" id="dateTo" placeholder="تا تاریخ" />
        </div>
        <div class="filter-group" style="flex: 1.5;">
          <input type="text" id="searchInput" placeholder="جستجو در عنوان..." />
        </div>
        <div class="filter-group" style="flex: 0.5;">
          <button id="clearFilters" class="btn-clear w-100">حذف فیلتر</button>
        </div>
      </div>
    </div>

    <!-- جدول -->
    <div class="modern-card p-0">
      <div class="table-responsive">
        <table class="modern-table">
          <thead>
            <tr>
              <th>شماره</th>
              <th>عنوان</th>
              <th>واحد</th>
              <th>وضعیت</th>
              <th>تاریخ بروزرسانی</th>
              <th>عملیات</th>
            </tr>
          </thead>
          <tbody id="ticketsTable">
            {% include 'customer_panel/profile/support/partials/ticket_rows.html' %}
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="{% static 'support/js/ticket_list.js' %}"></script>
{% endblock %}
