<style>
  .search-mode-desc { margin: 6px 0 16px; color: #475569; font-size: 14px; line-height: 1.9; }
</style>
<div class="search-card">
  <!-- تب‌های انتخاب نوع حمل -->
  <div class="search-tabs" role="tablist">
    <button type="button" class="tab active" role="tab" data-mode="sea" onclick="setTab(this)">🚢 دریایی</button>
    <button type="button" class="tab" role="tab" data-mode="air" onclick="setTab(this)">✈️ هوایی</button>
    <button type="button" class="tab" role="tab" data-mode="land" onclick="setTab(this)">🚚 زمینی</button>
  </div>

  <form method="get" action="{% url 'orders:create_request' %}" class="search-form" id="service-search-form">
    <input type="hidden" name="mode" id="mode-input" value="sea" />

    <p class="search-mode-desc" data-desc="sea">
      حمل کانتینری (FCL) یا خرده‌بار (LCL) — نرخ شرکت‌های حمل دریایی را مقایسه و بهترین را انتخاب کنید.
    </p>
    <p class="search-mode-desc" data-desc="air" hidden>
      حمل سریع هوایی — نرخ شرکت‌ها بر اساس وزن قابل‌پرداخت محاسبه و مقایسه می‌شود.
    </p>
    <p class="search-mode-desc" data-desc="land" hidden>
      درون‌شهری، برون‌شهری یا بین‌المللی — بار خود را با کرایه‌ی پیشنهادی اعلام کنید؛ اولین شرکتی که بپذیرد، حمل می‌کند.
    </p>

    <button type="submit" class="search-submit" id="service-search-submit">استعلام قیمت</button>
  </form>
</div>

<script>
  function setTab(btn) {
    document.querySelectorAll('.search-tabs .tab').forEach(function (b) {
      b.classList.toggle('active', b === btn);
    });
    var mode = btn.dataset.mode;
    document.getElementById('mode-input').value = mode;
    document.querySelectorAll('.search-mode-desc').forEach(function (p) {
      p.hidden = p.dataset.desc !== mode;
    });
    var form = document.getElementById('service-search-form');
    var submit = document.getElementById('service-search-submit');
    if (mode === 'land') {
      form.action = "{% url 'land_freight:request_create' %}";
      document.getElementById('mode-input').disabled = true;
      submit.textContent = 'ثبت اعلام بار';
    } else {
      form.action = "{% url 'orders:create_request' %}";
      document.getElementById('mode-input').disabled = false;
      submit.textContent = 'استعلام قیمت';
    }
  }
</script>
